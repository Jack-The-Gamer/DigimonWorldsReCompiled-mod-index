[mod]
id = "dw1-better-exp"
name = "DW1 Better EXP"
version = "1.0.0"
author = "Jack-The-Gamer"
description = "Twice the stat gains from training at any gym, and three times the stat gains from battles."
game = "dw1"
script = "main.lua"
categories = ["GAMEPLAY", "BALANCE"]
tags = ["training", "stats", "battle", "gym"]
license = "MIT"
engine = ">=0.2.6"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@dw1-better-exp"

[[option]]
id = "training"
name = "Training gains"
description = "How much more the gyms give: 2 = twice as much."
type = "int"
default = 2
min = 1
max = 5

[[option]]
id = "battle"
name = "Battle gains"
description = "How much more a won battle gives: 3 = three times as much."
type = "int"
default = 3
min = 1
max = 5
