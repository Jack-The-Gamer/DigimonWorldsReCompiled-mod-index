[mod]
id = "fast-forward"
name = "Fast-Forward"
version = "1.0.0"
author = "Jack-The-Gamer"
description = "Press Select and Start together to play at double speed, again for triple speed, and a third time for normal speed. The music keeps playing at its normal speed."
game = "any"
script = "main.lua"
categories = ["QOL"]
tags = ["speed", "fast-forward", "audio"]
license = "MIT"
engine = ">=0.2.6"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@fast-forward"

[[option]]
id = "effects"
name = "Sound effects"
description = "Normal pitch: effects sound exactly as at normal speed. Sped up: effects play faster and higher, like the rest of the game."
type = "choice"
default = "Normal pitch"
choices = ["Normal pitch", "Sped up"]
