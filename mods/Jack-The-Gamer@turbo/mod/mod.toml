[mod]
id = "turbo"
name = "Turbo"
version = "1.0.1"
author = "Jack-The-Gamer"
description = "Hold the turbo button (R2), then hold one or two other buttons: they are pressed and released rapidly for as long as you hold them. The game never sees the turbo button."
game = "any"
script = "main.lua"
categories = ["QOL"]
tags = ["turbo", "input", "dialogue"]
license = "MIT"
engine = ">=0.2"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@turbo"
# Turbo replaces Turbo Text; both would fight over the turbo button.
conflicts = ["turbo-text"]

[[option]]
id = "hold"
name = "Turbo button"
description = "Hold this, then the buttons to turbo. The game never sees it."
type = "choice"
default = "R2"
choices = ["R2", "L2"]

[[option]]
id = "rate"
name = "Frames per press"
description = "How fast turbo presses: 2 is fastest (30 presses a second), 30 slowest."
type = "int"
default = 4
min = 2
max = 30
