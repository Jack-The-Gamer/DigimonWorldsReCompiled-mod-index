[mod]
id = "turbo-text"
name = "Turbo Text"
version = "1.0.0"
author = "Jack-The-Gamer"
description = "Hold the turbo button to rapidly tap Cross, racing through dialogue. The game itself never sees the turbo button, so nothing changes unless you hold it."
game = "any"
script = "main.lua"
categories = ["QOL"]
tags = ["dialogue", "turbo", "input"]
license = "MIT"
engine = ">=0.2"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@turbo-text"

[[option]]
id = "hold"
name = "Turbo button"
type = "choice"
default = "R2"
choices = ["R2", "L2", "R1", "L1", "Select"]

[[option]]
id = "tap"
name = "Button to tap"
type = "choice"
default = "Cross"
choices = ["Cross", "Circle"]

[[option]]
id = "rate"
name = "Frames per tap"
type = "int"
default = 4
min = 2
max = 30
