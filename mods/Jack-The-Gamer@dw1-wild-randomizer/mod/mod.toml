[mod]
id = "dw1-wild-randomizer"
name = "DW1 Wild Digimon Randomizer"
version = "0.4.0"
author = "Jack-The-Gamer"
description = "The wild Digimon you meet on the field become other Digimon of the same stage that share at least two of their specialties, fighting with techniques drawn at random from their own. Story Digimon and recruits stay as they are. Works with DW1 Expanded Roster, whose new Digimon can turn up too."
game = "dw1"
serials = ["SLUS-01032"]
script = "main.lua"
categories = ["GAMEPLAY"]
tags = ["randomizer", "wild digimon", "enemies", "battle"]
license = "MIT"
engine = ">=1.6"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@dw1-wild-randomizer"

[[option]]
id = "reroll"
name = "New Digimon"
description = "Every visit: each time you enter an area, its wild Digimon are picked again. Fixed: an area always has the same wild Digimon."
type = "choice"
default = "Every visit"
choices = ["Every visit", "Fixed"]

[[option]]
id = "techniques"
name = "Techniques"
description = "Random: each wild Digimon fights with techniques drawn at random from all of its own, plus its finisher. Matched: it uses techniques like the ones the original Digimon had."
type = "choice"
default = "Random"
choices = ["Random", "Matched"]

[[option]]
id = "arena"
name = "Arena opponents"
description = "The Digimon you meet in File City's Arena tournaments become other Digimon of the same stage that share two specialties, from the cup's own line-up, so a Fire Cup still has fire Digimon."
type = "bool"
default = true

[[option]]
id = "expanded_roster"
name = "Include Expanded Roster Digimon"
description = "With DW1 Expanded Roster installed, its new Digimon can be wild Digimon too."
type = "bool"
default = true
