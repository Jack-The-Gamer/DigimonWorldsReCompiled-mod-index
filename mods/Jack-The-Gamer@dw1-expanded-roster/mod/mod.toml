[mod]
id = "dw1-expanded-roster"
name = "DW1 Expanded Roster"
version = "0.4.0"
author = "Jack-The-Gamer"
description = "Digimon from Digimon World 2003 and Digimon World 2 come to Digimon World, built from your own copies: Guilmon, Growlmon and WarGrowlmon; Veemon, ExVeemon, Veedramon, Paildramon and AeroVeedramon; Deltamon and Kimeramon; MegaKabuterimon, Okuwamon and Garudamon. Tentomon, PlatinumSukamon and KingSukamon become raisable, Machinedramon, HerculesKabuterimon and Phoenixmon become Megas, and every Digimon follows a revised evolution tree. Work in progress."
game = "dw1"
serials = ["SLUS-01032"]
script = "main.lua"
engine = ">=1.6"
uses_games = ["dw3", "dw2"]
categories = ["CONTENT", "GAMEPLAY"]
tags = ["digivolution", "new digimon", "guilmon", "growlmon", "wargrowlmon", "veemon", "veedramon", "paildramon"]
license = "MIT"
github = "Jack-The-Gamer/DigimonWorldsReCompiled-mod-index"
homepage = "https://github.com/Jack-The-Gamer/DigimonWorldsReCompiled-mod-index/tree/HEAD/mods/Jack-The-Gamer@dw1-expanded-roster"
experimental = true

[[option]]
id = "check_relocation"
name = "Check the table move (for developers)"
type = "bool"
default = false
description = "Blank the game's original tables after moving them, so any code still reading them fails at once."

[[option]]
id = "test_clone"
name = "Test Digimon (for developers)"
type = "bool"
default = false
description = "Adds Digimon number 199, a copy of Agumon named Test Agumon, to test new Digimon numbers."

[[option]]
id = "check_evolution"
name = "Check the evolution pickers (for developers)"
type = "bool"
default = false
description = "Compares the mod's evolution pickers with the game's own on random partner stats (in the field), and logs the result."

[[option]]
id = "test_raised"
name = "Count new Digimon as raised (for developers)"
type = "bool"
default = true
description = "Shows the new Digimon's icons on the Digivolution Chart as if you had raised them (a save has no room to record that yet)."
