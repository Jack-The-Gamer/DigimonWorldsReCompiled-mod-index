name: Validate

on:
  pull_request:
  push:
    branches-ignore: [main, gh-pages]

permissions:
  contents: read

env:
  RUST_BACKTRACE: '0'
  TOOL: tools/build-index/target/release/build-index

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: tools/build-index
      - name: Build and test the index tool
        run: |
          cargo build --quiet --release --manifest-path tools/build-index/Cargo.toml
          cargo test --quiet --release --manifest-path tools/build-index/Cargo.toml
      - name: Check every entry
        run: '"$TOOL" validate --examples'
      - name: Check hosted mods with Re:Compiled's own validator
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/check-hosted.sh
      - name: Resolve releases (does each listed mod have an installable release?)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$TOOL" build --releases --out "$RUNNER_TEMP/site"'
